summary: >-
  Cello publishes list prices for two separate product lines on one pricing page. User Referrals
  is priced against referral ARR generated (success-based) and starts at a paid tier; Partner
  Referrals is priced against partner and campaign counts and has a free tier. Prices are shown as
  monthly, billed monthly. Several tiers display a promotional discount badge on the page, so the
  figure recorded is the price as displayed at fetch time, not necessarily the undiscounted list
  price. Nothing on the page is machine-readable; there is no pricing or catalog API.
