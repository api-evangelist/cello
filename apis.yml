aid: cello
name: Cello
description: >-
  Cello is an all-in-one, AI-powered referral platform for SaaS companies. It lets
  product teams embed in-product user referrals and run partner/affiliate programs
  with a few lines of code, then automates attribution, campaigns, notifications,
  fraud detection, and cross-border payouts. Cello ships an embeddable Referral
  Component and Attribution JS SDK for web plus native iOS, Android, Flutter, and
  React Native SDKs, a REST API for tokens, referral-code validation, events, and
  new-user rewards, a Growth Portal for analytics, and an official hosted MCP server
  exposing developer and growth-manager tools. Customers include Typeform, Miro,
  Descript, Pleo, and SmallPDF. Backed by HV Capital.
url: https://raw.githubusercontent.com/api-evangelist/cello/refs/heads/main/apis.yml
