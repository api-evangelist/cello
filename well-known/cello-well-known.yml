findings:
- id: no-security-txt
  severity: low
  detail: >-
    Cello serves no /.well-known/security.txt on any host, and publishes no vulnerability
    disclosure policy, bug bounty, or trust center page (probed separately). There is no
    machine-discoverable way to report a security issue.
  evidence:
  - url: https://cello.so/.well-known/security.txt
    status: 404
  - url: https://api.cello.so/.well-known/security.txt
    status: 404
  - url: https://docs.cello.so/.well-known/security.txt
    status: 404
- id: oauth-only-for-mcp
  severity: info
  detail: >-
    The OAuth surface belongs to the MCP server, not the REST API. api.cello.so authenticates with
    an accessKeyId/secretAccessKey exchange at POST /token returning a bearer accessToken; it
    publishes no OAuth metadata and none of the mcp:read / mcp:write scopes apply to it.
  evidence:
  - url: https://mcp.cello.so/.well-known/oauth-protected-resource
    status: 200
  - url: https://api.cello.so/.well-known/oauth-authorization-server
    status: 404
