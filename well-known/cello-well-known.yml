method: probed
source: live GET of /.well-known/* on every Cello host in apis.yml plus the MCP and auth hosts
summary: >-
  Cello serves a real /.well-known/ discovery surface, but only on two hosts and only for the
  agent/OAuth surfaces. docs.cello.so serves an A2A agent card (and the agent skill it points at).
  mcp.cello.so serves RFC 9728 OAuth protected-resource metadata for the hosted MCP server, which
  names https://auth.cello.so as the authorization server; auth.cello.so serves full RFC 8414
  authorization-server metadata and an identical OpenID Connect discovery document. The marketing
  site (cello.so) and the REST API host (api.cello.so) serve nothing at /.well-known/ — no
  security.txt, no api-catalog, no ai-plugin.json. cello.so answers every /.well-known/* path with
  its 404 HTML page (SPA-style catch-all); api.cello.so answers with a JSON {"message":"Not Found"}.
