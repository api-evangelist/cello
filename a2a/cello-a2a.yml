findings:
- id: linked-skill-serves-a-403-script-url
  severity: high
  detail: >-
    The Agent Skill this card points at instructs agents to load Attribution JS from
    https://assets.cello.so/attribution/latest/attribution.js (and the sandbox equivalent). That
    URL returns 403. Cello's human-facing docs use cello-attribution.js, which returns 200. The
    machine-readable path and the human path disagree, and only the machine one is broken.
