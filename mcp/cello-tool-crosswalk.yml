mcp_only:
- tool: cello_get_program_metrics
  category: analytics
  reason: >-
    Returns lifetime referrer and new-user funnel totals, ARR, weekly/monthly trend series, and
    GTM-segmented industry benchmarks. No public REST operation exposes program metrics,
    benchmarks, or any aggregate; this is Growth Portal data with no REST equivalent.
  audience: growth
- tool: cello_get_referrers
  category: analytics
  reason: >-
    Lists and sorts referrers by engagement/performance. Parameters filter (matches ucc, email,
    productUserId, or referrer id), page (1-indexed, 10 per page), sort (net new ARR default;
    also revenue, signups, purchases, unique views, recent activity). The REST API has no
    referrer list or search operation — its only referrers path is
    POST /referrers/{productUserId}/depersonalize, a GDPR erasure write.
  audience: growth
- tool: cello_get_top_referrers
  category: analytics
  reason: >-
    Top referrers by net new ARR, descending. Parameter page (1-indexed, 10 per page). No REST
    ranking or leaderboard operation exists.
  audience: growth
- tool: cello_get_integration_status
  category: diagnostics
  reason: >-
    Per-component connectionStatus (connected / connectedWithWarnings / notConnected), optional
    warningType, and lastEventReceived for the referral widget, attribution widget, signup
    tracking and purchase tracking. Portal telemetry; no REST health or status operation.
  audience: developer
- tool: cello_get_events
  category: diagnostics
  reason: >-
    Reads back recent events Cello received, newest first, with source, validation status and a
    per-field breakdown (ucc, productUserId, email, customerId). The REST API is write-only for
    events (POST /events); there is no GET /events, so this tool exposes data the REST surface
    cannot return.
  audience: developer
  near_miss: POST /events
  near_miss_note: >-
    Same domain object, opposite direction. The REST operation ingests an event; the tool reads
    the ingestion log. Deliberately NOT bound — binding them would claim an inverse relationship
    the API does not offer.
- tool: cello_get_recommendations
  category: analytics
  reason: >-
    Prioritized best-practice recommendations grouped by activation, sharing and conversion, with
    completed/pending status, effort and impact labels. Derived program advice; no REST analogue.
  audience: both
- tool: search_cello
  category: documentation
  reason: Knowledge-base search over Cello docs, code examples and API references. Not an API operation.
  audience: both
- tool: query_docs_filesystem_cello
  category: documentation
  reason: >-
    Read-only query interface over an in-memory filesystem of the Cello documentation pages and
    OpenAPI specs — path reads, exact keyword and regex search. Not an API operation.
  audience: both
