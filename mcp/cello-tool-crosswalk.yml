findings:
- id: disjoint-surfaces
  detail: >-
    Zero of eight MCP tools bind to a REST operation and zero of six REST operations have a tool.
    The MCP server exposes Growth Portal reporting that has no public REST API behind it, and the
    REST API exposes integration primitives that have no tool. An agent given the MCP server can
    observe a Cello program but cannot operate one; an agent given the REST API can operate one
    but cannot observe it.
- id: no-operation-ids
  detail: >-
    The published OpenAPI declares no operationId on any of its six operations, so REST rows here
    are identified by method + path. Any future binding will need operationIds added upstream.
- id: gated-schema
  detail: >-
    tools/list at https://mcp.cello.so/mcp returns 401 with
    WWW-Authenticate: Bearer resource_metadata="https://mcp.cello.so/.well-known/oauth-protected-resource".
    Tool names and parameters here come from Cello's published tool reference; the authoritative
    inputSchema still requires an authenticated introspection.
