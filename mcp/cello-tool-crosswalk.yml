summary: >-
  Cello's MCP server and Cello's REST API are two disjoint surfaces. The eight published MCP tools
  are read-only analytics, integration-health and documentation tools that report on a configured
  referral program; the six REST operations are write-and-lookup primitives for embedding the
  program in a product. Not one MCP tool is backed by a public REST operation, and not one REST
  operation has a tool. The crosswalk is therefore all mcp_only and all rest_only — a real
  finding, not a mapping failure. The live MCP schema is OAuth-gated (POST tools/list returns 401
  with a WWW-Authenticate resource_metadata challenge), so tool parameters below are taken from
  Cello's own published tool reference, never guessed.
