findings:
- id: agent-skill-serves-a-403-script-url
  severity: high
  detail: >-
    Cello's published Agent Skill at
    https://docs.cello.so/.well-known/agent-skills/cello/skill.md tells agents to install
    Attribution JS from https://assets.cello.so/attribution/latest/attribution.js (and the sandbox
    equivalent). That URL returns 403. The working file, and the one Cello's human docs use at
    https://docs.cello.so/sdk/client-side/embedded-script-tag, is cello-attribution.js. An agent
    following Cello's own machine-readable skill writes a broken script tag.
  evidence:
  - url: https://assets.cello.so/attribution/latest/attribution.js
    status: 403
  - url: https://assets.cello.so/attribution/latest/cello-attribution.js
    status: 200
