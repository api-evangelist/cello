note: >-
  First-party Cello client libraries. Every mobile SDK is published to a real registry — npm for
  React Native, Maven Central for Android, CocoaPods and Swift Package Manager for iOS, pub.dev for
  Flutter — which a previous round missed. The two web SDKs (Cello JS and Attribution JS) are not
  registry packages: they load from the assets.cello.so CDN at an unpinned /latest/ path, so a
  consumer cannot pin or identify a version.
currency_summary: >-
  The Android SDK is the release train: so.cello.android:cello-sdk shipped 0.14.0 on 2026-08-07,
  and getcello/cello-ios-sp carries a matching 0.14.0 Swift Package tag. Two distributions of the
  same SDK have fallen behind that train — the CocoaPods pod CelloSDK is still 0.9.0 from
  2025-09-08 (five minor releases and eleven months stale), and the npm React Native wrapper is
  0.13.0 from 2026-04-25 while its repo already tags v0.14.0-rc.0. The Flutter plugin is a single
  0.0.1 release from 2025-12-16 and is labelled Beta in the docs. Cello's own Android install
  snippet still pins 0.9.1 (2025-09-09), five releases behind what it publishes.
