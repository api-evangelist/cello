- id: no-server-side-sdk
  severity: info
  detail: >-
    Cello ships no server-side SDK in any language — no npm, PyPI, Maven, NuGet, Go, RubyGems,
    Packagist or crates.io package wraps the REST API. Every first-party library is a client-side
    or mobile referral component. Server integration is raw HTTP against api.cello.so.
